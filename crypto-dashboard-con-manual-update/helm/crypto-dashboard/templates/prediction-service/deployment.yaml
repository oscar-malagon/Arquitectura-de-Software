apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-service
  labels:
    app: prediction-service
spec:
  replicas: {{ .Values.predictionService.replicaCount }}
  selector:
    matchLabels:
      app: prediction-service
  template:
    metadata:
      labels:
        app: prediction-service
    spec:
      containers:
        - name: prediction-service
          image: "{{ .Values.predictionService.image.repository }}:{{ .Values.predictionService.image.tag }}"
          ports:
            - containerPort: 4002
              name: http
          env:
            - name: PORT
              value: "4002"
            - name: PRICE_SERVICE_URL
              value: "http://price-service:4001"
          resources:
            {{- toYaml .Values.predictionService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5 