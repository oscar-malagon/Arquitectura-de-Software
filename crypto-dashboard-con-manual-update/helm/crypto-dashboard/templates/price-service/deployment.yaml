apiVersion: apps/v1
kind: Deployment
metadata:
  name: price-service
  labels:
    app: price-service
spec:
  replicas: {{ .Values.priceService.replicaCount }}
  selector:
    matchLabels:
      app: price-service
  template:
    metadata:
      labels:
        app: price-service
    spec:
      containers:
        - name: price-service
          image: "{{ .Values.priceService.image.repository }}:{{ .Values.priceService.image.tag }}"
          ports:
            - containerPort: 4001
              name: http
          env:
            - name: PORT
              value: "4001"
          resources:
            {{- toYaml .Values.priceService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5 